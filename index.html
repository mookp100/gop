<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Department</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .box {
      padding: 32px 48px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.8);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { margin: 0 0 12px; }
    p { margin: 0; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="box">
    <h1>สาขาสาระสนเทศ</h1>
    <p>เว็บไซต์กำลังทำงานบน Vercel แล้ว</p>
  </div>
</body>
</html>
